name = "iqamah-push-scheduler"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Per-minute Cron Trigger — scans subscriptions and sends due reminders.
[triggers]
crons = ["* * * * *"]

[vars]
SITE_ORIGIN = "https://iqamah.co.uk"
VAPID_SUBJECT = "mailto:prayerly@hotmail.com"

# Shared with the Pages worker (_worker.js). Replace `id` with the namespace id
# from: wrangler kv namespace create PUSH_SUBS
[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "21dacec89daf443c9e087a009467dbed"

# Secrets (set with `wrangler secret put <NAME>` — do NOT commit):
#   VAPID_PUBLIC_KEY    — base64url, from `npx web-push generate-vapid-keys`
#   VAPID_PRIVATE_KEY   — base64url private key (32-byte d)
#   SCHEDULER_SECRET    — optional, guards the /run manual-trigger endpoint
