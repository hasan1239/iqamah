      box-shadow: 0 0 8px rgba(212,175,55,0.4);
      border: 2px solid var(--card-bg);
      z-index: 2;
    }

    /* Actions */
    .qibla-actions { margin-top: 32px; width: 100%; max-width: 280px; }
    .qibla-enable-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none; color: #0a0a0a; padding: 14px 24px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
      box-shadow: 0 4px 15px var(--gold-shadow);
    }
    .qibla-enable-btn:hover { transform: translateY(-1px); }
    .qibla-enable-btn:active { transform: scale(0.97); }
    .qibla-enable-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .qibla-location {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 16px; padding: 12px; border-radius: 12px;
      background: var(--gold-tint-08); border: 1px solid var(--gold-tint-10);
      color: var(--text-muted); font-size: 0.8rem;
    }
    .qibla-permission { margin-bottom: 12px; }

    /* ============================================
       SETTINGS VIEW
       ============================================ */
    .settings-view { max-width: 500px; margin: 0 auto; }
    .settings-header { margin-bottom: 24px; }

    .settings-group {
      margin-bottom: 24px;
    }
    .settings-group-title {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text-muted); margin-bottom: 8px; padding-left: 4px;
    }
    .settings-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: 12px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      margin-bottom: 4px; text-decoration: none; color: inherit;
      transition: background 0.2s;
    }
    .settings-item:last-of-type { margin-bottom: 0; }
    .settings-link:hover { background: var(--card-hover-bg); }

    .settings-item-left { display: flex; align-items: center; gap: 12px; }
    .settings-icon { display: flex; color: var(--gold); }
    .settings-label { font-size: 0.95rem; color: var(--text-primary); }
    .settings-desc { display: block; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; margin-top: 4px; }
    .settings-value { font-size: 0.85rem; color: var(--text-muted); }
    .settings-input { background: transparent; border: 1px solid var(--divider); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; color: var(--text-primary); font-family: inherit; width: 140px; text-align: left; }
    .settings-input:focus { outline: none; border-color: var(--gold); }
    .settings-chevron { color: var(--text-muted); display: flex; }
    .settings-pinned-right { display: flex; align-items: center; gap: 8px; }
    .settings-remove-btn {
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid var(--divider); border-radius: 6px;
      color: var(--text-muted); cursor: pointer; padding: 4px;
      transition: all 0.2s;
    }
    .settings-remove-btn:hover { color: var(--error); border-color: var(--error); }

    .settings-reset-btn {
      background: none; border: 1px solid var(--divider); border-radius: 8px;
      color: var(--text-muted); cursor: pointer; padding: 4px 12px;
      font-size: 0.7rem; font-weight: 600; transition: all 0.2s;
    }
    .settings-reset-btn:hover { color: var(--error); border-color: var(--error); }
    .settings-reset-confirm { background: var(--error); color: #fff; border-color: var(--error); }
    .settings-reset-confirm:hover { background: var(--error); color: #fff; }

    /* Toggle switch */
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--divider); border-radius: 24px;
      transition: background 0.3s;
    }
    .toggle-track::after {
      content: ''; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--gold); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(20px); }

    /* Theme segmented control */
    .theme-segmented {
      display: flex;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 8px;
      padding: 2px;
      position: relative;
      min-width: 156px;
    }
    .theme-segmented-slider {
      position: absolute;
      top: 2px; left: 2px;
      height: calc(100% - 4px);
      width: calc(33.33% - 1px);
      background: var(--gold);
      border-radius: 6px;
      transition: transform 0.3s ease;
      z-index: 0;
    }
    .theme-segmented[data-active="night"] .theme-segmented-slider { transform: translateX(100%); }
    .theme-segmented[data-active="dark"] .theme-segmented-slider { transform: translateX(200%); }
    .theme-segmented button {
      flex: 1;
      padding: 5px 8px;
      border: none;
      background: transparent;
      color: var(--toggle-inactive);
      font-size: 12px;
      font-weight: 600;
      font-family: 'Lato', sans-serif;
      cursor: pointer;
      border-radius: 6px;
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
    }
    .theme-segmented button:hover { color: var(--toggle-inactive-hover); }
    .theme-segmented button.active { color: #1a1a2e; }

    /* ============================================
       ADD MASJID VIEW
       ============================================ */
    .add-masjid-view { max-width: 700px; margin: 0 auto; }
    .add-masjid-view .card { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    @media (min-width: 768px) {
      .add-masjid-view { max-width: none; }
      .add-masjid-view #step3 .card {
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 80px);
        padding: 16px 24px;
      }
    }
    .add-subtitle { font-size: 0.9rem; color: var(--text-tertiary); margin-bottom: 8px; line-height: 1.4; }

    .progress-bar { display: flex; align-items: flex-start; justify-content: center; margin: 20px 0; gap: 0; }

    /* ========== Feature: Prayer Tracker (merged from _agent_css/tracker.css) ========== */
/* ============================================
   PRAYER TRACKER VIEW
   ============================================ */
/* Status colours — night (default) values; light overrides below.
   The OLED dark theme inherits the night values, matching the rest
   of the app's variable cascade. */
:root {
  --tr-jamaah: var(--gold);
  --tr-ontime: var(--green);
  --tr-late: #c9824d;
  --tr-missed: rgba(255,255,255,0.30);
  --tr-empty: rgba(255,255,255,0.16);
  --tr-ontime-tint: rgba(144,192,144,0.12);
  --tr-late-tint: rgba(201,130,77,0.12);
  --tr-missed-tint: rgba(255,255,255,0.06);
  --tr-on-status: #0c1220;
}
:root[data-theme="light"] {
  --tr-late: #a8651f;
  --tr-missed: rgba(26,26,46,0.30);
  --tr-empty: rgba(26,26,46,0.16);
  --tr-ontime-tint: rgba(45,122,79,0.10);
  --tr-late-tint: rgba(168,101,31,0.10);
  --tr-missed-tint: rgba(26,26,46,0.06);
  --tr-on-status: #ffffff;
}

/* Status colour hook — elements carrying .tr-st-* read var(--trc) */
.tr-st-jamaah { --trc: var(--tr-jamaah); }
.tr-st-ontime { --trc: var(--tr-ontime); }
.tr-st-late { --trc: var(--tr-late); }
.tr-st-missed { --trc: var(--tr-missed); }

.tracker-view { padding: 4px 0 100px; max-width: 600px; margin: 0 auto; }
.tracker-header { text-align: center; margin-bottom: 20px; padding-top: 16px; }
.tracker-header h1 { font-family: 'Lato', sans-serif; font-size: 1.5rem; color: var(--gold); font-weight: 700; margin: 0 0 6px; }
.tracker-subtitle { font-size: 0.8rem; color: var(--text-muted); margin: 0; }

/* Shared card chrome */
.tracker-streak-card, .tracker-today-card, .tracker-month-card, .tracker-stat, .tracker-editor {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}

/* In-card header (Today / Editor) */
.tracker-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.tracker-card-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--gold); }
.tracker-card-date { font-size: 0.75rem; color: var(--text-muted); }

/* ---------- Streak card ---------- */
.tracker-streak-card { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 12px; }
.tracker-flame {
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--gold-tint-10); border: 1px solid var(--gold-tint-15); color: var(--gold);
}
.tracker-flame svg { width: 24px; height: 24px; }
.tracker-flame.is-zero { color: var(--text-muted); background: var(--divider-subtle); border-color: var(--divider); }
.tracker-streak-text { flex: 1; min-width: 0; }
.tracker-streak-count { font-size: 1rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
.tracker-streak-count strong { font-size: 1.5rem; color: var(--gold); font-weight: 700; margin-right: 1px; }
.tracker-streak-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; line-height: 1.35; }
.tracker-streak-best { display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; padding-left: 12px; border-left: 1px solid var(--divider); }
.tracker-streak-best span { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
.tracker-streak-best strong { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }

/* ---------- Today check-in card ---------- */
.tracker-today-card { position: relative; padding: 14px 12px 12px; margin-bottom: 12px; }
.tracker-today-card .tracker-card-head { padding: 0 4px; }
.tracker-seg-row { display: flex; }
.tracker-seg {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: none; border: none; padding: 6px 2px; cursor: pointer;
  font-family: inherit; border-radius: 10px;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s;
}
.tracker-seg:hover { background: var(--gold-tint-08); }
.tracker-seg:active { transform: scale(0.96); }
.tracker-seg-name { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); }
.tracker-seg-dot {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px dashed var(--tr-empty); color: var(--text-muted);
  background: transparent; transition: background 0.2s, border-color 0.2s;
}
.tracker-seg-dot svg { width: 15px; height: 15px; }
.tracker-seg-dot.tr-st-jamaah, .tracker-seg-dot.tr-st-ontime, .tracker-seg-dot.tr-st-late {
  background: var(--trc); border: none; color: var(--tr-on-status);
}

  letter-spacing: 0.5px;
