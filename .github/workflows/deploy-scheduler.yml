name: Deploy push-scheduler

# The push-scheduler Worker is a separate deploy surface — Cloudflare Pages
# auto-deploy does NOT cover it. This deploys it on changes to push-scheduler/**.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - main
    paths:
      - 'push-scheduler/**'
      - '.github/workflows/deploy-scheduler.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: push-scheduler
