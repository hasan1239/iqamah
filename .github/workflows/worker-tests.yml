name: Worker Tests

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'tests/**'
      - 'prompts/extraction.txt'
  pull_request:
    paths:
      - '_worker.js'
      - 'tests/**'
      - 'prompts/extraction.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run worker API tests
        run: node --test tests/worker.test.mjs
