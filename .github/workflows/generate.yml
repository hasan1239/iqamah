name: Generate Daily Lockscreen

on:
  # Run daily at 12:07am UK time
  schedule:
    - cron: '07 0 * * *'

  # Run on push to main branch when relevant files change
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'generate.py'
      - '.github/workflows/generate.yml'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate (YYYY-MM-DD), leave blank for today'
        required: false
      mosque:
        description: 'Mosque (faizul / quba / masjid_aisha / all)'
        required: false
        default: 'all'
      template:
        description: 'Template version (leave blank to auto-detect from season)'
        required: false
      refresh_full_year_feeds:
        description: 'Also re-fetch the full-year feeds (Mawaqit, My-Masjid) now instead of waiting for Sunday'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Lockscreen PNG generation is PAUSED: committing a PNG per masjid per day grew
  # the repo past GitHub's size limit, so output/ and latest/ are gitignored and
  # untracked. The data refresh steps below still run daily. The site's Download
  # button renders lockscreens on-device (js/utils/lockscreen-render.js).
  # To resume: set this to 'true', flip LOCKSCREEN_CI_ENABLED in _worker.js and
  # LOCKSCREEN_CI_FALLBACK in js/views/prayer-times.js, and decide where the PNGs
  # live first. Committing them to git again will regrow the repo.
  GENERATE_LOCKSCREENS: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clear stale pending flags
        shell: python3 {0}
        run: |
          import json, csv, os, glob
          from datetime import datetime, date
          months = {'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12}
          today = datetime.now().date()
          def row_date(row):
              # Provider CSVs: lowercase 'date', ISO. Worker CSVs: 'Date', ISO
              # (older ones "1 Oct", which were all 2026).
              s = (row.get('Date') or row.get('date') or '').strip()
              try:
                  return date.fromisoformat(s)
              except ValueError:
                  parts = s.split()
                  if len(parts) == 2 and parts[1] in months and parts[0].isdigit():
                      return date(2026, months[parts[1]], int(parts[0]))
              return None
          for path in sorted(glob.glob('data/mosques/*.json')):
              if path.endswith('index.json') or path.endswith('index-slim.json'):
                  continue
              with open(path) as f:
                  c = json.load(f)
              # A pending backup timetable whose rows are all in the past no
              # longer shows anywhere, so stop flagging it for review
              if c.get('backup_pending') and c.get('backup_csv'):
                  bpath = os.path.join('data', c['backup_csv'])
                  future = False
                  if os.path.exists(bpath):
                      with open(bpath) as f:
                          future = any((d := row_date(r)) and d >= today for r in csv.DictReader(f))
                  if not future:
                      print(f"Clearing backup_pending for {os.path.basename(path)}")
                      del c['backup_pending']
                      with open(path, 'w') as f:
                          json.dump(c, f, indent=2)
                          f.write('\n')
              is_pending_update = c.get('pending_update')
              is_unapproved = c.get('approved') == False
              if not is_pending_update and not is_unapproved:
                  continue
              slug = os.path.basename(path).replace('.json', '')
              csv_path = os.path.join('data', c.get('csv', slug + '.csv'))
              has_future = False
              if os.path.exists(csv_path):
                  with open(csv_path) as f:
                      for row in csv.DictReader(f):
                          d = row_date(row)
                          if d and d >= today:
                              has_future = True
                              break
              if not has_future:
                  changed = False
                  if is_pending_update:
                      print(f'Clearing pending_update for {slug}')
                      c['pending_update'] = False
                      changed = True
                  if is_unapproved:
                      print(f'Clearing pending review for {slug}')
                      c['approved'] = True
                      changed = True
                  if changed:
                      with open(path, 'w') as f:
                          json.dump(c, f, indent=2)
                          f.write('\n')

      - name: Regenerate mosque index
        run: |
          # Bundle all mosque configs into index.json (plus the index-slim.json
          # companion the list views fetch) so the landing page needs one fetch.
          # Shared logic lives in providers/__init__.py:regenerate_index.
          python3 -c "
          from pathlib import Path
          from providers import regenerate_index
          count = regenerate_index(Path('data/mosques'))
          print(f'✅ Regenerated data/mosques/index.json + index-slim.json ({count} masjids)')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: env.GENERATE_LOCKSCREENS == 'true'
        run: |
          pip install playwright Pillow
          playwright install --with-deps chromium

      - name: Refresh MasjidBox prayer times
        run: |
          # Daily-accumulating MasjidBox masjids: upsert today/tomorrow into each
          # masjid's CSV. Uses only stdlib, so no extra deps. Non-fatal on errors.
          # Each call returns 2 days, so we fetch half the list per day (shard by
          # day parity) — every masjid is still refreshed every other day
          # with no gaps, and the daily API footprint is halved. Days since the
          # epoch, not day-of-year: 31 Dec (day 365) and 1 Jan (day 1) are both
          # odd, which left one shard with no row for 1 January.
          if [ -f data/masjidbox_uk.txt ]; then
            SHARD=$(( $(date -u +%s) / 86400 % 2 ))
            python -m providers.masjidbox.bulk --of 2 --shard "$SHARD" || echo "⚠️ MasjidBox fetch had errors (continuing)"
          else
            echo "No data/masjidbox_uk.txt — skipping MasjidBox refresh"
          fi

      - name: Refresh Masjidal (AthanPlus) prayer times
        run: |
          # Scrapes the AthanPlus widget (~7 days) into each masjid's CSV. Non-fatal.
          if [ -f data/masjidal_uk.txt ]; then
            python -m providers.masjidal.bulk || echo "⚠️ Masjidal fetch had errors (continuing)"
          else
            echo "No data/masjidal_uk.txt — skipping Masjidal refresh"
          fi

      - name: Refresh full-year feeds (weekly, or when a year runs out)
        if: github.event_name == 'schedule' || github.event.inputs.refresh_full_year_feeds == 'true'
        run: |
          # Mawaqit and My-Masjid publish a whole year at once, so they don't
          # need a daily fetch, but masjids do correct their calendars (e.g.
          # clock-change errors). Full re-fetch weekly (Sundays) so fixes reach
          # the app. On other days, re-fetch only masjids with no row for today:
          # their CSVs cover one calendar year, so on 1 January they're all
          # empty until re-fetched, and one dead feed shouldn't trigger a full
          # re-fetch every day. Non-fatal throughout: a failure here must not
          # skip the commit (and lose the day's MasjidBox/Masjidal data).
          FULL=no
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event.inputs.refresh_full_year_feeds }}" = "true" ]; then
            FULL=yes
          fi
          MAWAQIT_MISSING=$(python -m providers.feed_health --types mawaqit --format ref) || { echo "::warning::feed_health failed - doing a full refresh"; FULL=yes; }
          MYMASJID_MISSING=$(python -m providers.feed_health --types mymasjid --format ref) || { echo "::warning::feed_health failed - doing a full refresh"; FULL=yes; }
          if [ "$FULL" = "yes" ]; then
            [ -f data/mawaqit_uk.txt ] && { python -m providers.mawaqit.bulk --delay 1.5 || echo "⚠️ Mawaqit fetch had errors (continuing)"; }
            [ -f data/mymasjid_uk.txt ] && { python -m providers.mymasjid.bulk || echo "⚠️ My-Masjid fetch had errors (continuing)"; }
            exit 0
          fi
          if [ -n "$MAWAQIT_MISSING" ]; then
            echo "Mawaqit masjids with no row for today:"; echo "$MAWAQIT_MISSING"
            python -m providers.mawaqit.bulk --delay 1.5 --only "$(echo "$MAWAQIT_MISSING" | paste -sd, -)" || echo "⚠️ Mawaqit fetch had errors (continuing)"
          fi
          if [ -n "$MYMASJID_MISSING" ]; then
            echo "My-Masjid masjids with no row for today:"; echo "$MYMASJID_MISSING"
            python -m providers.mymasjid.bulk --only "$(echo "$MYMASJID_MISSING" | paste -sd, -)" || echo "⚠️ My-Masjid fetch had errors (continuing)"
          fi
          if [ -z "$MAWAQIT_MISSING$MYMASJID_MISSING" ]; then
            echo "Not Sunday and no full-year feed has run out - skipping"
          fi

      - name: Refresh LondonPrayerTimes (when its year runs out)
        if: github.event_name == 'schedule' || github.event.inputs.refresh_full_year_feeds == 'true'
        env:
          LPT_API_KEY: ${{ secrets.LPT_API_KEY }}
        run: |
          # The London Unified timetable is published a year at a time (12 API
          # calls), so only fetch when a LondonPrayerTimes masjid has no row for
          # today (i.e. 1 January) or on a manual full refresh. Needs the
          # LPT_API_KEY repository secret (free key from londonprayertimes.com/api).
          RUN_OUT=$(python -m providers.feed_health --types londonprayertimes) || RUN_OUT="feed_health failed"
          if [ -z "$RUN_OUT" ] && [ "${{ github.event.inputs.refresh_full_year_feeds }}" != "true" ]; then
            echo "LondonPrayerTimes has today's times - skipping"
            exit 0
          fi
          if [ -z "$LPT_API_KEY" ]; then
            echo "::warning::LondonPrayerTimes needs a refresh but the LPT_API_KEY secret is not set"
            exit 0
          fi
          for slug in $(python -m providers.feed_health --types londonprayertimes --every --format slug || true); do
            python -m providers.londonprayertimes.fetch "$slug" || echo "⚠️ LondonPrayerTimes fetch failed for $slug (continuing)"
          done

      - name: Re-check feed times against the sun
        run: |
          # Offline and quick: re-run the sun-position check for every live-feed
          # masjid from its CSV, so the hide window (today + 2 days) moves daily
          # even for feeds fetched weekly or yearly (providers/requalify.py).
          # Non-fatal: a failure must not skip the commit below.
          python -m providers.requalify || echo "::warning::requalify failed (continuing)"

      - name: Determine date, mosque, and template
        if: env.GENERATE_LOCKSCREENS == 'true'
        id: params
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(TZ='Europe/London' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          MOSQUE="${{ github.event.inputs.mosque }}"
          echo "mosque=${MOSQUE:-all}" >> $GITHUB_OUTPUT
          TEMPLATE="${{ github.event.inputs.template }}"
          echo "template=${TEMPLATE}" >> $GITHUB_OUTPUT

      - name: List available templates
        if: env.GENERATE_LOCKSCREENS == 'true'
        run: |
          echo "📋 Available templates:"
          ls -1 templates/lockscreen_*.html | sed 's/templates\/lockscreen_/  - /' | sed 's/\.html//'

      - name: Generate lockscreen(s)
        if: env.GENERATE_LOCKSCREENS == 'true'
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
        run: |
          TEMPLATE="${{ steps.params.outputs.template }}"
          if [ -n "$TEMPLATE" ]; then
            python generate.py ${{ steps.params.outputs.mosque }} ${{ steps.params.outputs.date }} --template "$TEMPLATE"
          else
            python generate.py ${{ steps.params.outputs.mosque }} ${{ steps.params.outputs.date }}
          fi

      - name: Clean up old lockscreens
        if: env.GENERATE_LOCKSCREENS == 'true'
        run: |
          # Compute the 3 dates to keep (today, -1d, -2d) in ddmmm format
          KEEP_DATES=""
          for i in 0 1 2; do
            KEEP_DATES="$KEEP_DATES $(date -d "${{ steps.params.outputs.date }} - $i days" +%d%b | tr '[:upper:]' '[:lower:]')"
          done
          echo "Keeping dates: $KEEP_DATES"

          # Remove output files not matching any kept date
          removed=0
          for f in output/ramadan_lockscreen_*.png; do
            [ -e "$f" ] || continue
            keep=false
            for d in $KEEP_DATES; do
              if [[ "$f" == *"_${d}.png" ]]; then
                keep=true
                break
              fi
            done
            if [ "$keep" = false ]; then
              echo "Removing: $f"
              rm "$f"
              removed=$((removed + 1))
            fi
          done
          echo "🧹 Removed $removed old lockscreen(s)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mosques/ data/*.csv data/raw/
          if [ "$GENERATE_LOCKSCREENS" = "true" ]; then
            # -f: output/ and latest/ are gitignored while generation is paused
            git add -f output/ latest/
            MSG="🌙 Lockscreen for ${{ steps.params.outputs.date }}"
          else
            MSG="🔄 Data refresh for $(TZ='Europe/London' date +%Y-%m-%d)"
          fi
          git commit -m "$MSG" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Check every live feed has today's times
        run: |
          # The refresh steps above are non-fatal by design, which once let the
          # Masjidal feed fail silently for four months (the widget changed its
          # date format). Fail the run (GitHub emails the owner) when any
          # live-feed masjid has no row for today. Runs after the commit, so the
          # rest of the refresh still lands.
          python -m providers.feed_health --fail
